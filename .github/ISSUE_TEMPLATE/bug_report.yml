name: Bug report
description: Report a DeepBass Android or Web Studio problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not upload copyrighted songs, recordings, or private audio. Share only technical details."
  - type: dropdown
    id: platform
    attributes:
      label: Where did the issue happen?
      options:
        - Android app
        - DeepBass Web Studio
        - Both
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android / OS version
      placeholder: "Moto G82, Android 13 / Chrome version"
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Audio format
      placeholder: "MP3 / WAV / FLAC / M4A"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What is not working?
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open DeepBass... 2. Choose a file... 3. Press play..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not included private or copyrighted audio in this report.
          required: true